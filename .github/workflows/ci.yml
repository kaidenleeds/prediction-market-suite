name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: kalshi-suite
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: kalshi-suite/go.mod
          cache-dependency-path: kalshi-suite/go.sum
      - run: go test ./... -count=1 -timeout 25m
      - run: go vet ./...
